name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Backup and mirror against a real throwaway Vaultwarden, from a fresh reset (about 10 minutes).
  # Manual only (Actions tab -> Build -> Run workflow) until it has proven itself on a GitHub runner.
  e2e:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get install -y p7zip-full
      - run: npm ci
      - run: npm run e2e

  # Pull requests: prove the image builds for both CPU types, without pushing anything.
  image-check:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64

  build:
    needs: test
    if: github.event_name == 'push'
    env:
      IMAGE: johnlindahl/bitwarden-backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_API_USER }}
          password: ${{ secrets.DOCKER_API_KEY }}
      - name: Bump version and push tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GHA_PAT }}
      - uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.new_tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # One tag, two architectures: Docker picks the right one (Intel/AMD vs Apple Silicon/ARM).
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_API_USER }}
          password: ${{ secrets.DOCKER_API_KEY }}
          repository: ${{ env.IMAGE }}
